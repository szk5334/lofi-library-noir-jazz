name: Build library

# Runs whenever the track list changes, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [tracks.json, scripts/fetch.py, .github/workflows/fetch.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Download, convert, credit
        run: python3 scripts/fetch.py

      - name: Commit results
        run: |
          git config user.name  "nightdeck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          MSG=$(python3 -c "import json; s=json.load(open('fetch-report.json'))['summary']; print('Library update: %d/%d tracks, %s MB' % (s['in_library'], s['listed'], s['audio_mb']))")
          git commit -m "$MSG"
          git push
